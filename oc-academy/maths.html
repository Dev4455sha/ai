form:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-25%)}}</head><body><div class="app"><header class="top"><div class="brand"><h1>📐 JEE Mathematics Forge</h1><p>Main speed • Advanced reasoning • adaptive practice • infinite resources</p></div><nav class="nav"><a href="jee.html">🏠 PCM Hub</a><a href="physics.html">⚡ Physics</a><a href="chemistry.html">🧪 Chemistry</a><a href="maths.html">📐 Maths</a></nav></header>
<section class="hero"><h2>Turn every theorem into a problem-solving weapon.</h2><div class="muted">Workflow: structure → substitution/representation → theorem or invariant → algebra → domain check → limiting case.</div></section>
<div class="panel"><div class="controls"><select id="chapter"><option value="all">🎲 Any chapter</option></select><select id="exam"><option value="main">JEE Main</option><option value="adv">JEE Advanced</option></select><select id="type"><option value="auto">Adaptive</option><option value="mcq">Single Correct</option><option value="multi">Multiple Correct</option><option value="num">Numerical</option></select><button class="main" id="new">⚡ New problem</button><button id="hard">🔥 Harder</button></div><div class="modes"><button class="pill active" data-m="q">🎯 Problem Forge</button><button class="pill" data-m="chap">🗺️ Chapter Matrix</button><button class="pill" data-m="tool">🧰 Solver Frameworks</button></div><div id="arena"></div></div>

</div><script>
const CH=[['sets','Sets, Relations & Functions'],['complex','Complex Numbers'],['quad','Quadratic Equations'],['seq','Sequences & Series'],['pnc','Permutations, Combinations & Binomial'],['mat','Matrices & Determinants'],['prob','Probability & Statistics'],['trig','Trigonometry & Inverse Trig'],['line','Straight Lines'],['circle','Circle'],['conic','Parabola, Ellipse & Hyperbola'],['3d','3D Geometry'],['limits','Limits & Continuity'],['diff','Differentiation & Applications'],['int','Integral Calculus'],['vector','Vectors'],['mixed','Mixed Advanced Mathematics']];
const Q=[
['sets','main','mcq','If |A|=3 and |B|=2, then |A×B| is:',['A) 5','B) 6','C) 8','D) 9'],'B','|A×B|=|A||B|=6'],
['complex','adv','mcq','For z≠0, which represents a circle centered at origin?',['A) |z|=1','B) arg z=π/4','C) Re(z)=1','D) Im(z)=1'],'A','|z|=constant is a circle centered at the origin.'],
['quad','main','mcq','If roots of x²−5x+6=0 are α,β then α+β is:',['A) 1','B) 2','C) 5','D) 6'],'C','By Vieta, α+β=5.'],
['seq','adv','mcq','For |r|<1, the infinite geometric series a+ar+ar²+… equals:',['A) a(1−r)','B) a/(1−r)','C) a/(1+r)','D) ar/(1−r)'],'B','Standard GP sum.'],
['pnc','main','mcq','Number of 3-letter arrangements from 5 distinct letters without repetition is:',['A) 10','B) 20','C) 60','D) 125'],'C','5P3=5·4·3=60.'],
['mat','main','mcq','For a 2×2 matrix, determinant zero implies the matrix is:',['A) invertible','B) singular','C) orthogonal','D) diagonal'],'B','A square matrix is singular iff determinant is zero.'],
['prob','adv','mcq','For independent events A,B, P(A∩B)=:',['A) P(A)+P(B)','B) P(A)P(B)','C) P(A)/P(B)','D) 1−P(A)P(B)'],'B','Independence gives product rule.'],
['trig','main','mcq','sin²x+cos²x equals:',['A) 0','B) 1','C) sin2x','D) cos2x'],'B','Fundamental identity.'],
['line','adv','mcq','Distance between parallel lines ax+by+c₁=0 and ax+by+c₂=0 is:',['A) |c₁+c₂|/√(a²+b²)','B) |c₁−c₂|/√(a²+b²)','C) (c₁−c₂)/(a+b)','D) √(a²+b²)/|c₁−c₂|'],'B','Standard point-to-line separation.'],
['circle','main','mcq','The circle x²+y²=r² has centre:',['A) (r,r)','B) (0,0)','C) (−r,0)','D) (0,−r)'],'B','No linear terms means centre at origin.'],
['conic','adv','mcq','For a parabola y²=4ax, focus is:',['A) (0,a)','B) (a,0)','C) (−a,0)','D) (0,−a)'],'B','Standard form.'],
['3d','main','mcq','A vector normal to plane ax+by+cz=d is:',['A) (a,b,c)','B) (d,d,d)','C) (1,1,1)','D) none'],'A','Plane coefficients form its normal vector.'],
['limits','main','mcq','lim x→0 sin x/x is:',['A) 0','B) 1','C) ∞','D) does not exist'],'B','Standard trigonometric limit in radians.'],
['diff','adv','mcq','If f is differentiable and has a local interior maximum at x₀, which must hold?',['A) f′(x₀)=1','B) f′(x₀)=0','C) f″(x₀)>0','D) f(x₀)=0'],'B','Fermat’s theorem under interior differentiability assumptions.'],
['int','main','mcq','∫₀¹ 2x dx equals:',['A) 0','B) 1','C) 2','D) 4'],'B','Antiderivative x² evaluated from 0 to 1.'],
['vector','adv','multi','For vectors a,b with non-zero magnitudes:',['A) a·b=|a||b|cosθ','B) |a×b|=|a||b|sinθ','C) a×b is parallel to a','D) a·b is a vector'],'AB','Dot is scalar; cross is perpendicular to both.']
].map(x=>({ch:x[0],exam:x[1],type:x[2],text:x[3],opts:x[4],ans:x[5],sol:x[6]}));
let cur=null,hard=0;let pcmStats=JSON.parse(localStorage.getItem('mathsPCMStats')||'null')||{solved:0,correct:0,advanced:0};function sendPerf(ok){pcmStats.solved++;if(ok)pcmStats.correct++;if(cur.exam==='adv'&&ok)pcmStats.advanced++;localStorage.setItem('mathsPCMStats',JSON.stringify(pcmStats));if(window.parent!==window)window.parent.postMessage({type:'pcm-performance',subject:'Mathematics',chapter:(CH.find(x=>x[0]===cur.ch)||[cur.ch,cur.ch])[1],exam:cur.exam,correct:!!ok,advanced:cur.exam==='adv',timestamp:Date.now()},'*')}function pool(){let c=chapter.value,e=exam.value,t=type.value,d=Q.filter(x=>(c==='all'||x.ch===c)&&x.exam===e);if(t!=='auto')d=d.filter(x=>x.type===t);return d.length?d:Q.filter(x=>x.exam===e)}function next(){cur=pool()[Math.floor(Math.random()*pool().length)];renderQ()}
function renderQ(){let o=cur.opts?'<div class="opts">'+cur.opts.map((x,i)=>'<button class="opt pcmOptionIn" style="animation-delay:'+(i*60)+'ms" data-a="'+String.fromCharCode(65+i)+'">'+x+'</button>').join('')+'</div>':'<input class="num" id="num">';arena.innerHTML='<div class="q pcmQuestionIn"><div class="qtop"><b>'+cur.exam.toUpperCase()+' · '+cur.type.toUpperCase()+'</b><span>Hardness '+(cur.d||1+hard)+'</span></div><div class="qtext">'+cur.text+'</div>'+o+'<div class="actions" style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><button id="hint">💡 Hint</button><button id="sol">📖 Solution</button><button id="skip">⏭ Skip</button></div><div id="fb"></div></div>';document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>check(b.dataset.a));hint.onclick=()=>fb.innerHTML='<div class="solution">Translate the statement into algebra, identify the invariant/theorem, then check domain.</div>';sol.onclick=()=>fb.innerHTML='<div class="solution">'+cur.sol+'</div>';skip.onclick=next}
function pcmFeedback(ok){let x=document.getElementById('pcmFeedback');if(!x){x=document.createElement('div');x.id='pcmFeedback';x.className='pcmFeedback';document.body.appendChild(x)}x.textContent=ok?'✅ Correct — model confirmed':'🧠 Not yet — diagnose, then retry';x.classList.remove('show');void x.offsetWidth;x.classList.add('show');const q=document.querySelector('.q');if(q){q.classList.remove(ok?'pcmWrongShake':'pcmCorrectGlow');void q.offsetWidth;q.classList.add(ok?'pcmCorrectGlow':'pcmWrongShake')}}
function check(v){let ok=String(v)===String(cur.ans);pcmFeedback(ok);sendPerf(ok);document.querySelectorAll('.opt').forEach(b=>b.classList.add(b.dataset.a===cur.ans?'correct':' '));fb.innerHTML='<div class="solution">'+(ok?'✅ Correct':'❌ Not yet')+' — '+cur.sol+'</div>'}
CH.forEach(c=>{let o=document.createElement('option');o.value=c[0];o.textContent=c[1];chapter.appendChild(o);let p=o.cloneNode(true);rch.appendChild(p)});function matrix(){arena.innerHTML='<div class="modules">'+CH.map((c,i)=>'<div class="mod"><b>'+String(i+1).padStart(2,'0')+' · '+c[1]+'</b><span>Concepts, Main drills, Advanced constructions, timed sets and infinite resources.</span></div>').join('')+'</div>'}function frameworks(){arena.innerHTML='<div class="modules"><div class="mod"><b>Domain Lock</b><span>Check definitions, exclusions and endpoint behavior before solving.</span></div><div class="mod"><b>Representation Switch</b><span>Move algebra ↔ geometry ↔ graph ↔ vectors when one representation stalls.</span></div><div class="mod"><b>Invariant Hunt</b><span>Look for symmetry, homogeneity, monotonicity, conservation and substitutions.</span></div><div class="mod"><b>Case Split</b><span>Separate sign, parameter and equality cases systematically.</span></div><div class="mod"><b>Limit Test</b><span>Probe extreme and special cases to validate the result.</span></div><div class="mod"><b>Answer Audit</b><span>Dimensions, domain, multiplicity, extraneous roots and geometry.</span></div></div>'}document.querySelectorAll('.pill').forEach(b=>b.onclick=()=>{document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));b.classList.add('active');({q:next,chap:matrix,tool:frameworks})[b.dataset.m]()});new.onclick=next;hard.onclick=()=>{hard=Math.min(3,hard+1);next()};exam.onchange=next;type.onchange=next;
const packs={sets:['prove a set identity two different ways','construct a relation with a prescribed domain/range','find the hidden domain trap'],complex:['derive a locus in the Argand plane','construct a modulus inequality','design a roots-of-unity symmetry drill'],quad:['build a parameterized root-location problem','prove a Vieta identity','find the discriminant trap'],seq:['derive a finite-sum identity','construct a recurrence and analyze growth','build a telescoping trap'],pnc:['construct a bijective counting solution','derive a combinatorial identity','make an overcounting trap'],mat:['prove a determinant identity','construct a rank/invertibility test','build a matrix-equation trap'],prob:['construct a Bayes problem','derive a conditional-probability identity','build an independence trap'],trig:['derive a general solution','construct an inverse-trig domain trap','build a graph-symmetry challenge'],line:['derive a distance relation','construct concurrent lines','build a sign trap'],circle:['derive a tangent condition','construct a chord/locus problem','build a center-radius trap'],conic:['derive a tangent/normal relation','construct a focus-directrix locus','build an eccentricity trap'],3d:['derive an angle between planes','construct a shortest-distance problem','build a direction-ratio trap'],limits:['derive a limit by two methods','construct a removable-discontinuity example','build an expansion trap'],diff:['prove a monotonicity claim','construct an optimization problem','build a derivative-sign trap'],int:['derive an integral by substitution and parts','construct an area problem','build a constant-of-integration trap'],vector:['derive a vector identity','construct a coplanarity test','build a scalar-vs-vector trap'],mixed:['construct a multi-chapter Advanced problem','force a representation switch','build a limit/domain consistency audit']};
let rc=0;function gen(){let k=rch.value,ex=rex.value,t=rty.value==='any'?Object.keys(packs):[rty.value],kind=t[Math.floor(Math.random()*t.length)],a=packs[k][Math.floor(Math.random()*packs[k].length)],tw=['State assumptions.','Check a limiting case.','Do not trust the first representation.','Finish with a domain audit.'];let text=(ex==='adv'?'Advanced: ':'Main: ')+a+' '+tw[Math.floor(Math.random()*tw.length)];rc++;rmain.innerHTML='<div class="resmain"><b>'+kind.toUpperCase()+'</b><p class="muted">'+text+'</p><div class="solution">Output standard: labelled setup → symbolic reasoning → check → final interpretation.</div></div>';const d=document.createElement('div');d.className='mini';d.innerHTML='<b>'+kind+' · '+k+'</b><span>'+text+'</span>';feed.prepend(d);while(feed.children.length>60)feed.lastChild.remove();count.textContent=rc+' generated'}rnew.onclick=gen;r10.onclick=()=>{for(let i=0;i<10;i++)gen()};next();gen();
</script><script id="pcmAiCoachScript">(function(){
if(document.getElementById('pcmAiCoach'))return;
const box=document.createElement('div');box.id='pcmAiCoach';box.innerHTML='<div class="h">🤖 AI Coach <span class="live">● ACTIVE</span></div><div class="b"><div class="r" id="pcmAiRec">Reading…</div><div class="w" id="pcmAiWhy">Suggestion only — <b>you choose the action.</b></div><div class="a"><button id="pcmAiRetry">Do suggestion</button><button id="pcmAiReview">Review</button><button id="pcmAiOwn">✋ My choice</button></div></div>';document.body.appendChild(box);
let qStart=Date.now(),lastQuestion='',lastAction='open',lastSent=0,hiddenUntil=0;let lastSolved=(typeof pcmStats.solved!=='undefined'?pcmStats.solved:0),lastCorrect=(typeof pcmStats.correct!=='undefined'?pcmStats.correct:0);
function txt(id){const e=document.getElementById(id);return e?e.textContent:''}
function send(action,extra){if(window.parent!==window)window.parent.postMessage(Object.assign({type:'pcm-screen',subject:'Mathematics',chapter:(typeof cur!=='undefined'&&cur)?(CH.find(x=>x[0]===cur.ch)||[cur.ch,cur.ch])[1]:'Unknown',exam:(typeof cur!=='undefined'&&cur)?cur.exam:null,action,timestamp:Date.now(),seconds:Math.floor((Date.now()-qStart)/1000)},extra||{}),'*');}
function reco(){
 const sec=Math.floor((Date.now()-qStart)/1000),a=lastAction;
 if(a==='wrong')return ['Diagnose this miss before the next question.','Name the exact error: concept, setup, algebra, sign, units, reading, or time.'];
 if(a==='correct'&&typeof cur!=='undefined'&&cur.exam==='adv')return ['Stress-test the solution once.','Check a limit, dimension, sign, symmetry or alternate route before moving on.'];
 if(a==='hint')return ['Use the hint, then solve unaided.','A hint is a rescue signal—not evidence of mastery.'];
 if(a==='solution')return ['Recall the method without looking.','Close the solution and reproduce the key steps from memory.'];
 if(a==='skip')return ['Queue this question for review.','Keep momentum, but return after the next 2–3 questions.'];
 if(sec>=120)return ['Decide now: solve or skip.','Two minutes on one question is a decision point; avoid passive staring.'];
 return ['Target: '+('Mathematics')+' — '+((typeof cur!=='undefined'&&cur)?(CH.find(x=>x[0]===cur.ch)||[cur.ch,cur.ch])[1]:'current chapter'),'Attempt first. Use hints only after a genuine setup.'];
}
function render(){const x=reco();document.getElementById('pcmAiRec').textContent=x[0];document.getElementById('pcmAiWhy').textContent=x[1];}
function observeQuestion(){const q=document.querySelector('#arena .q');const now=q?q.querySelector('.qtext')?.textContent||'':'';if(now&&now!==lastQuestion){lastQuestion=now;qStart=Date.now();lastAction='question';send('question');render()}}
const arena=document.getElementById('arena');if(arena){new MutationObserver(observeQuestion).observe(arena,{childList:true,subtree:true});}
document.addEventListener('click',function(e){const b=e.target.closest('button');if(!b)return;const id=b.id||'',tx=(b.textContent||'').toLowerCase();if(id==='hint'||tx.includes('hint')){lastAction='hint';send('hint');render()}else if(id==='sol'||tx.includes('solution')){lastAction='solution';send('solution');render()}else if(id==='skip'||tx.includes('skip')){lastAction='skip';send('skip');render()}});
window.addEventListener('message',function(e){if(e.data&&e.data.type==='pcm-coach-action'){if(e.data.action==='retry'&&typeof next==='function'){next();lastAction='retry';qStart=Date.now();render()}}});

document.getElementById('pcmAiOwn').onclick=function(){lastAction='student-choice';document.getElementById('pcmAiRec').textContent='✋ Your choice is primary.';document.getElementById('pcmAiWhy').textContent='Keep doing what you think is best. I will continue tracking and suggest again after your next action.';};document.getElementById('pcmAiReview').onclick=function(){if(typeof cur!=='undefined'&&window.parent!==window){window.parent.postMessage({type:'pcm-coach-open',target:'revision',subject:'Mathematics',chapter:(CH.find(x=>x[0]===cur.ch)||[cur.ch,cur.ch])[1]},'*')}};observeQuestion();render();setInterval(function(){render();try{const sv=pcmStats.solved,cv=pcmStats.correct;if(sv!==lastSolved){lastAction=cv>lastCorrect?'correct':'wrong';qStart=Date.now();send(lastAction,{correct:cv>lastCorrect,advanced:(typeof cur!=='undefined'&&cur)?cur.exam==='adv':false});lastSolved=sv;lastCorrect=cv;render()}}catch(e){}if(Date.now()-lastSent>4000){send(lastAction);lastSent=Date.now()}},1000);
})();</script></body></html>
