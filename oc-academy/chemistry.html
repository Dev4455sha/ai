form:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-25%)}}</head><body><div class="app"><header class="top"><div class="brand"><h1>🧪 JEE Chemistry Forge</h1><p>Physical • Inorganic • Organic • Main + Advanced</p></div><nav class="nav"><a href="jee.html">🏠 PCM Hub</a><a href="physics.html">⚡ Physics</a><a href="chemistry.html">🧪 Chemistry</a><a href="maths.html">📐 Maths</a><a href="index.html">🧬 Organic Deep Lab</a></nav></header>
<section class="hero"><h2>Predict Chemistry from first principles.</h2><div class="muted">Branches: <b>Physical</b> = model + equations; <b>Inorganic</b> = structure + periodic trends + exact facts; <b>Organic</b> = electron flow + mechanism + selectivity.</div></section>
<div class="panel"><div class="controls"><select id="branch"><option value="all">🧪 All branches</option><option value="physical">Physical</option><option value="inorganic">Inorganic</option><option value="organic">Organic</option></select><select id="exam"><option value="main">JEE Main</option><option value="adv">JEE Advanced</option></select><select id="type"><option value="auto">Adaptive</option><option value="mcq">Single Correct</option><option value="multi">Multiple Correct</option></select><button class="main" id="new">⚡ New question</button><button id="hard">🔥 Harder</button></div><div class="tabs"><button class="pill active" data-m="q">🎯 Question Forge</button><button class="pill" data-m="branches">🗺️ Branch Matrix</button><button class="pill" data-m="rules">🧠 High-yield Rules</button></div><div id="arena"></div></div>

const Q=[
['physical','main','mcq','For an ideal gas under isothermal change, ΔU is:',['A) >0','B) <0','C) 0','D) path dependent'],'C','For an ideal gas U depends only on T.'],

['physical','main','mcq','At fixed temperature, a gas obeying Henry/Raoult-type solution reasoning must distinguish which quantity from concentration?',['A) mole fraction','B) colour','C) atomic number','D) electronegativity'],'A','Solution properties are commonly expressed through mole fraction/concentration variables.'],

['physical','main','mcq','In an electrochemical cell, oxidation occurs at the:',['A) cathode','B) anode','C) salt bridge only','D) electrolyte surface only'],'B','Oxidation is at the anode.'],

].map(x=>({branch:x[0],exam:x[1],type:x[2],text:x[3],opts:x[4],ans:x[5],sol:x[6]}));
const BR=[['physical','Physical','Mole concept • atomic structure • gases/solutions • thermodynamics • equilibrium • electrochemistry • kinetics • solid state • surface chemistry'],['inorganic','Inorganic','Periodicity • hydrogen • s/p/d/f blocks • coordination • metallurgy • qualitative analysis • environmental chemistry'],['organic','Organic','GOC • hydrocarbons • haloalkanes • alcohols/phenols/ethers • carbonyls • acids • amines • aromatics • biomolecules/polymers • practical organic']];
let cur=null,hard=0;let pcmStats=JSON.parse(localStorage.getItem('chemistryPCMStats')||'null')||{solved:0,correct:0,advanced:0};function sendPerf(ok){pcmStats.solved++;if(ok)pcmStats.correct++;if(cur.exam==='adv'&&ok)pcmStats.advanced++;localStorage.setItem('chemistryPCMStats',JSON.stringify(pcmStats));if(window.parent!==window)window.parent.postMessage({type:'pcm-performance',subject:'Chemistry',chapter:cur.branch,exam:cur.exam,correct:!!ok,advanced:cur.exam==='adv',timestamp:Date.now()},'*')}function pool(){let b=branch.value,e=exam.value,t=type.value,d=Q.filter(q=>(b==='all'||q.branch===b)&&q.exam===e);if(t!=='auto')d=d.filter(q=>q.type===t);return d.length?d:Q.filter(q=>q.exam===e)}function next(){cur=pool()[Math.floor(Math.random()*pool().length)];render()}function pcmFeedback(ok){let x=document.getElementById('pcmFeedback');if(!x){x=document.createElement('div');x.id='pcmFeedback';x.className='pcmFeedback';document.body.appendChild(x)}x.textContent=ok?'✅ Correct — model confirmed':'🧠 Not yet — diagnose, then retry';x.classList.remove('show');void x.offsetWidth;x.classList.add('show');const q=document.querySelector('.q');if(q){q.classList.remove(ok?'pcmWrongShake':'pcmCorrectGlow');void q.offsetWidth;q.classList.add(ok?'pcmCorrectGlow':'pcmWrongShake')}}
function render(){arena.innerHTML='<div class="q pcmQuestionIn"><div><b>'+cur.exam.toUpperCase()+' · '+cur.branch.toUpperCase()+'</b></div><div class="qtext">'+cur.text+'</div><div class="opts">'+cur.opts.map((o,i)=>'<button class="opt pcmOptionIn" style="animation-delay:'+(i*60)+'ms" data-a="'+String.fromCharCode(65+i)+'">'+o+'</button>').join('')+'</div><div class="sol" id="sol"></div></div>';arena.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=b.dataset.a===cur.ans;pcmFeedback(ok);arena.querySelectorAll('.opt').forEach(x=>x.classList.add(x.dataset.a===cur.ans?'correct':''));sendPerf(ok);sol.innerHTML=(ok?'✅ Correct':'❌ Not yet')+' — '+cur.sol})}function branches(){arena.innerHTML='<div class="branches">'+BR.map(x=>'<div class="branch"><b>'+x[1]+'</b><span>'+x[2]+'</span></div>').join('')+'</div>'}function rules(){arena.innerHTML='<div class="branches"><div class="branch"><b>Physical</b><span>Units → assumptions → equation → limiting case. Never substitute before the model is fixed.</span></div><div class="branch"><b>Inorganic</b><span>Fact → reason → exception. Connect periodic trends to electronic structure and oxidation states.</span></div><div class="branch"><b>Organic</b><span>Electron source → electron-poor site → arrow flow → intermediate → product → selectivity.</span></div></div>'}document.querySelectorAll('.pill').forEach(b=>b.onclick=()=>{document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));b.classList.add('active');({q:next,branches, rules})[b.dataset.m]()});new.onclick=next;hard.onclick=()=>{hard=Math.min(3,hard+1);next()};exam.onchange=next;type.onchange=next;
const packs={physical:['derive a thermodynamics relation and state assumptions','construct an equilibrium shift problem','make a kinetics graph interpretation','hunt a dimensional/concentration trap'],inorganic:['turn a periodic trend into fact→reason questions','construct a coordination geometry challenge','build an oxidation-state exception hunter','create a d/f-block cause-effect chain'],organic:['predict the electrophile/nucleophile pair','construct a mechanism-first substitution problem','build an oxidation/reduction identification drill','create a selectivity exception challenge']};let n=0;function gen(){let b=rbranch.value==='all'?Object.keys(packs)[Math.floor(Math.random()*3)]:rbranch.value,t=rtype.value==='any'?Object.keys({fact:1,mechanism:1,exception:1,numerical:1,reaction:1,coord:1,equilibrium:1})[Math.floor(Math.random()*7)]:rtype.value,a=packs[b][Math.floor(Math.random()*packs[b].length)],x=(rex.value==='adv'?'Advanced: ':'Main: ')+a+' State assumptions, one exception and one verification step.';n++;rmain.innerHTML='<div class="resource"><b>'+b.toUpperCase()+' · '+t.toUpperCase()+'</b><p class="muted">'+x+'</p><div class="sol">Self-check: structure → law/electron flow → result → exception → verification.</div></div>';let d=document.createElement('div');d.className='mini';d.innerHTML='<b>'+t+' · '+b+'</b><span>'+x+'</span>';feed.prepend(d);while(feed.children.length>60)feed.lastChild.remove();count.textContent=n+' generated'}gen.onclick=gen;gen10.onclick=()=>{for(let i=0;i<10;i++)gen()};next();gen();
</script><script id="pcmAiCoachScript">(function(){
if(document.getElementById('pcmAiCoach'))return;
const box=document.createElement('div');box.id='pcmAiCoach';box.innerHTML='<div class="h">🤖 AI Coach <span class="live">● ACTIVE</span></div><div class="b"><div class="r" id="pcmAiRec">Reading…</div><div class="w" id="pcmAiWhy">Suggestion only — <b>you choose the action.</b></div><div class="a"><button id="pcmAiRetry">Do suggestion</button><button id="pcmAiReview">Review</button><button id="pcmAiOwn">✋ My choice</button></div></div>';document.body.appendChild(box);
let qStart=Date.now(),lastQuestion='',lastAction='open',lastSent=0,hiddenUntil=0;let lastSolved=(typeof pcmStats.solved!=='undefined'?pcmStats.solved:0),lastCorrect=(typeof pcmStats.correct!=='undefined'?pcmStats.correct:0);
function txt(id){const e=document.getElementById(id);return e?e.textContent:''}
function send(action,extra){if(window.parent!==window)window.parent.postMessage(Object.assign({type:'pcm-screen',subject:'Chemistry',chapter:(typeof cur!=='undefined'&&cur)?cur.branch:'Unknown',exam:(typeof cur!=='undefined'&&cur)?cur.exam:null,action,timestamp:Date.now(),seconds:Math.floor((Date.now()-qStart)/1000)},extra||{}),'*');}
function reco(){
 const sec=Math.floor((Date.now()-qStart)/1000),a=lastAction;
 if(a==='wrong')return ['Diagnose this miss before the next question.','Name the exact error: concept, setup, algebra, sign, units, reading, or time.'];
 if(a==='correct'&&typeof cur!=='undefined'&&cur.exam==='adv')return ['Stress-test the solution once.','Check a limit, dimension, sign, symmetry or alternate route before moving on.'];
 if(a==='hint')return ['Use the hint, then solve unaided.','A hint is a rescue signal—not evidence of mastery.'];
 if(a==='solution')return ['Recall the method without looking.','Close the solution and reproduce the key steps from memory.'];
 if(a==='skip')return ['Queue this question for review.','Keep momentum, but return after the next 2–3 questions.'];
 if(sec>=120)return ['Decide now: solve or skip.','Two minutes on one question is a decision point; avoid passive staring.'];
 return ['Target: '+('Chemistry')+' — '+((typeof cur!=='undefined'&&cur)?cur.branch:'current chapter'),'Attempt first. Use hints only after a genuine setup.'];
}
function render(){const x=reco();document.getElementById('pcmAiRec').textContent=x[0];document.getElementById('pcmAiWhy').textContent=x[1];}
function observeQuestion(){const q=document.querySelector('#arena .q');const now=q?q.querySelector('.qtext')?.textContent||'':'';if(now&&now!==lastQuestion){lastQuestion=now;qStart=Date.now();lastAction='question';send('question');render()}}
const arena=document.getElementById('arena');if(arena){new MutationObserver(observeQuestion).observe(arena,{childList:true,subtree:true});}
document.addEventListener('click',function(e){const b=e.target.closest('button');if(!b)return;const id=b.id||'',tx=(b.textContent||'').toLowerCase();if(id==='hint'||tx.includes('hint')){lastAction='hint';send('hint');render()}else if(id==='sol'||tx.includes('solution')){lastAction='solution';send('solution');render()}else if(id==='skip'||tx.includes('skip')){lastAction='skip';send('skip');render()}});
window.addEventListener('message',function(e){if(e.data&&e.data.type==='pcm-coach-action'){if(e.data.action==='retry'&&typeof next==='function'){next();lastAction='retry';qStart=Date.now();render()}}});
window.addEventListener('message',function(e){if(e.data&&e.data.type==='pcm-performance'){lastAction=e.data.correct?'correct':'wrong';qStart=Date.now();send(lastAction,{correct:e.data.correct,advanced:e.data.advanced});render()}});
document.getElementById('pcmAiRetry').onclick=function(){if(typeof next==='function')next();else if(typeof renderQ==='function'&&typeof cur!=='undefined')renderQ();lastAction='retry';render();};
document.getElementById('pcmAiOwn').onclick=function(){lastAction='student-choice';document.getElementById('pcmAiRec').textContent='✋ Your choice is primary.';document.getElementById('pcmAiWhy').textContent='Keep doing what you think is best. I will continue tracking and suggest again after your next action.';};document.getElementById('pcmAiReview').onclick=function(){if(typeof cur!=='undefined'&&window.parent!==window){window.parent.postMessage({type:'pcm-coach-open',target:'revision',subject:'Chemistry',chapter:cur.branch},'*')}};observeQuestion();render();setInterval(function(){render();try{const sv=pcmStats.solved,cv=pcmStats.correct;if(sv!==lastSolved){lastAction=cv>lastCorrect?'correct':'wrong';qStart=Date.now();send(lastAction,{correct:cv>lastCorrect,advanced:(typeof cur!=='undefined'&&cur)?cur.exam==='adv':false});lastSolved=sv;lastCorrect=cv;render()}}catch(e){}if(Date.now()-lastSent>4000){send(lastAction);lastSent=Date.now()}},1000);
})();</script></body></html>
